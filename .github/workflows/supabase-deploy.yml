name: Supabase Deploy

# Manual fallback. CI already applies migrations and Edge Functions on every deploy (ci.yml):
# epic branches -> proofy-dev, main -> proofy-prod (after the prod approval). Use this to re-run a
# push without deploying the app, e.g. after fixing a secret.
# Always set "Use workflow from" to the epic branch: the run uses that branch's supabase/ folder.
# Secrets live in the chosen GitHub environment (dev -> proofy-dev, prod -> proofy-prod).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Supabase project
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Push auth config + migrations + functions (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Hosted auth config (supabase config push, Story 1.3). Per environment.
      AUTH_SITE_URL: ${{ secrets.AUTH_SITE_URL }}
      AUTH_SMTP_SENDER: ${{ secrets.AUTH_SMTP_SENDER }}
      AUTH_SMTP_PASS: ${{ secrets.AUTH_SMTP_PASS }}
      AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/supabase-push
