name: Seed dev

# Branch seed-dev only: seeds the Epic 4 demo group into proofy-dev (supabase/seed-dev).
# Never merged anywhere; never touches proofy-prod. Re-run safe (skips an existing group).

on:
  push:
    branches: [seed-dev]

permissions:
  contents: read

concurrency:
  group: seed-dev
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SEED_RESET: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow==11.3.0
      - run: python supabase/seed-dev/run.py
