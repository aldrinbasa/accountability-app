name: CI

# Gate + deploy pipeline (Story 1.1).
#
# Release rhythm: one branch per epic (e.g. `epic-1`), pushed for every story; merged to `main`
# only at epic end.
#   - push to any branch except main -> verify + db-test -> auth config + migrations + functions to proofy-dev
#                                       -> deploy Vercel Preview -> alias it to the stable dev URL
#   - push/merge to main             -> verify + db-test -> (approval on the `prod` environment)
#                                       -> auth config + migrations + functions to proofy-prod
#                                       -> deploy Vercel Production
# A failing job or step blocks every later deploy, so the app never goes live ahead of its
# database. Migrations must be additive and backward compatible (the previous app version keeps
# running against the new schema until the new one is live). `supabase-deploy.yml` is the manual
# fallback for re-running a database push alone.

on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run mid production deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned, never `latest` (Trove lesson: `latest` hits the rate-limited GitHub API).
  SUPABASE_CLI_VERSION: 3.1.0
  VERCEL_CLI_VERSION: 65.16.0
  STABLE_DEV_URL: proofy-dev.vercel.app

jobs:
  verify:
    name: Verify · typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: Service worker was produced
        run: test -f dist/sw.js

  db-test:
    name: Database · pgTAP · generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The types bot pushes with its own token; the stored GITHUB_TOKEN header would override it.
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase (database + auth only)
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,studio,edge-runtime,logflare,vector,supavisor
      # Runs before `supabase test db`, because the pgTAP setup file adds test-only schemas.
      # Only records whether the committed types are stale; pgTAP still runs either way.
      - name: Generate types and compare with the committed file
        id: types
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          if diff -u src/adapters/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload freshly generated types
        if: steps.types.outputs.stale == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: ${{ runner.temp }}/database.types.ts
          if-no-files-found: ignore
      - name: pgTAP
        run: supabase test db
      # Stale types on a non-main branch: commit the generated file back to the branch as a bot
      # commit (TYPES_PUSH_TOKEN, a fine-grained token with Contents read/write on this repo; the
      # built-in GITHUB_TOKEN would not start a new run). This run then fails so nothing deploys
      # with stale types; the bot commit's own run verifies and deploys. On main, or without the
      # token, the run just fails and the artifact above is the fallback. Never edit the file by hand.
      - name: Commit regenerated types (non-main) or fail
        if: steps.types.outputs.stale == 'true'
        env:
          TYPES_PUSH_TOKEN: ${{ secrets.TYPES_PUSH_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ -z "$TYPES_PUSH_TOKEN" ]; then
            echo "::error file=src/adapters/supabase/database.types.ts::Out of date. Download the 'database-types' artifact of this run (or run 'npm run gen:types') and commit it. Never edit it by hand."
            exit 1
          fi
          cp "$RUNNER_TEMP/database.types.ts" src/adapters/supabase/database.types.ts
          git config user.name "proofy-types-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/supabase/database.types.ts
          git commit -m "chore: regenerate database types (CI)"
          if ! git push "https://x-access-token:${TYPES_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"; then
            echo "::error::Types were stale and the bot commit could not be pushed (the branch moved, or the token lacks access). Download the 'database-types' artifact instead."
            exit 1
          fi
          echo "::error::Types were stale. Committed the regenerated file as $(git rev-parse --short HEAD); its CI run verifies and deploys. Pull before your next local change."
          exit 1

  deploy-preview:
    name: Deploy Preview (dev)
    if: github.ref != 'refs/heads/main'
    needs: [verify, db-test]
    runs-on: ubuntu-latest
    # One run at a time touches proofy-dev and the stable dev alias; queue, never cancel.
    # Shared with the manual Supabase Deploy (dev).
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment:
      name: dev
      url: https://${{ env.STABLE_DEV_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Hosted auth config (supabase config push, Story 1.3). Per environment.
      AUTH_SITE_URL: ${{ secrets.AUTH_SITE_URL }}
      AUTH_SMTP_SENDER: ${{ secrets.AUTH_SMTP_SENDER }}
      AUTH_SMTP_PASS: ${{ secrets.AUTH_SMTP_PASS }}
      AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Auth config + migrations + Edge Functions to proofy-dev
        uses: ./.github/actions/supabase-push
      # No prebuild: Vercel builds the source on its side, where it injects the Preview-scope env
      # vars (VITE_SUPABASE_* for proofy-dev). `vercel build` inside Actions would not.
      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --yes --token="$VERCEL_TOKEN")"
          echo "Preview deployment: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Calls the Vercel REST API directly: `vercel alias set` first loads the token's user
      # (/v2/user), which a team-scoped token cannot read ("User not found", 404).
      - name: Point the stable dev URL at this Preview
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          api="https://api.vercel.com"
          auth="Authorization: Bearer $VERCEL_TOKEN"
          host="${DEPLOY_URL#https://}"
          id="$(curl -sS --fail-with-body -H "$auth" "$api/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | jq -r '.id')"
          echo "Deployment id: $id"
          curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "{\"alias\":\"$STABLE_DEV_URL\"}" \
            "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID"
          echo
          echo "https://$STABLE_DEV_URL now serves $DEPLOY_URL"

  deploy-prod:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    needs: [verify, db-test]
    runs-on: ubuntu-latest
    # Shared with the manual Supabase Deploy (prod).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    # The `prod` environment has a required reviewer, so this job waits for an Approve click.
    environment:
      name: prod
      url: https://proofy.aldrinbasa.online
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Hosted auth config (supabase config push, Story 1.3). Per environment.
      AUTH_SITE_URL: ${{ secrets.AUTH_SITE_URL }}
      AUTH_SMTP_SENDER: ${{ secrets.AUTH_SMTP_SENDER }}
      AUTH_SMTP_PASS: ${{ secrets.AUTH_SMTP_PASS }}
      AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Auth config + migrations + Edge Functions to proofy-prod
        uses: ./.github/actions/supabase-push
      # Vercel builds with its Production-scope env vars (VITE_SUPABASE_* for proofy-prod).
      - name: Deploy to Vercel Production
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --yes --token="$VERCEL_TOKEN"
